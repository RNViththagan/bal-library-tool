name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Read Ballerina version from gradle.properties
        id: bal
        run: |
          BAL_VERSION="$(awk -F= '/^ballerinaLangVersion=/{print $2}' gradle.properties | tr -d '[:space:]')"
          if [ -z "$BAL_VERSION" ]; then
            echo "ERROR: ballerinaLangVersion not found in gradle.properties" >&2
            exit 1
          fi
          echo "version=$BAL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.4
        with:
          version: ${{ steps.bal.outputs.version }}

      - name: Derive release version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "ERROR: tag '$TAG' must start with 'v' (e.g. v0.2.0)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Resolve latest ballerina-language-server version
        id: ls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LS_TAG="$(gh release list --repo ballerina-platform/ballerina-language-server \
            --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -z "$LS_TAG" ] || [ "${LS_TAG#v}" = "$LS_TAG" ]; then
            echo "ERROR: unexpected LS tag '$LS_TAG' (expected 'v<version>')" >&2
            exit 1
          fi
          LS_VERSION="${LS_TAG#v}"
          echo "version=$LS_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved ballerina-language-server: $LS_VERSION"

      - name: Pin release version in gradle.properties and Ballerina.toml
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/^version=.*/version=${V}/" gradle.properties
          sed -i "s/^version = \".*\"/version = \"${V}\"/" Ballerina.toml
          echo "--- gradle.properties ---"
          cat gradle.properties
          echo "--- Ballerina.toml ---"
          cat Ballerina.toml

      - name: Build
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon --stacktrace -PlsVersion=${{ steps.ls.outputs.version }}

      - name: Stage release assets
        id: stage
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p release-assets dist-staging/bal-library-tool-${V}

          JAR="native/build/libs/native-${V}.jar"
          if [ ! -f "$JAR" ]; then
            echo "ERROR: expected native JAR not found at $JAR" >&2
            find native/build/libs -maxdepth 2 -type f >&2
            exit 1
          fi
          cp "$JAR" release-assets/

          BALA="$(find ballerina/build -name '*.bala' -type f 2>/dev/null | head -1 || true)"
          if [ -z "$BALA" ]; then
            echo "WARNING: no .bala produced under ballerina/build — skipping bala asset"
          else
            cp "$BALA" release-assets/
          fi

          cp "$JAR" dist-staging/bal-library-tool-${V}/
          cp Ballerina.toml dist-staging/bal-library-tool-${V}/
          cp release/install.sh dist-staging/bal-library-tool-${V}/install.sh
          chmod +x dist-staging/bal-library-tool-${V}/install.sh
          cp release/install.ps1 dist-staging/bal-library-tool-${V}/install.ps1
          printf '%s\n' "$V" > dist-staging/bal-library-tool-${V}/VERSION
          LS_VER="${{ steps.ls.outputs.version }}"
          BAL_VER="${{ steps.bal.outputs.version }}"
          {
            printf '%s\n' "# bal library tool — release ${V}"
            printf '\n'
            printf '%s\n' "Built against \`ballerina-language-server@${LS_VER}\`."
            printf '\n'
            printf '%s\n' "## Install"
            printf '\n'
            printf '%s\n' "**macOS / Linux:**"
            printf '%s\n' '```bash'
            printf '%s\n' "./install.sh"
            printf '%s\n' '```'
            printf '\n'
            printf '%s\n' "**Windows (PowerShell):**"
            printf '%s\n' '```powershell'
            printf '%s\n' ".\\install.ps1"
            printf '%s\n' '```'
            printf '\n'
            printf '%s\n' "Both installers require \`bal\` (Ballerina ${BAL_VER} or compatible) on \`PATH\` and run fully offline."
            printf '\n'
            printf '%s\n' "## Use"
            printf '\n'
            printf '%s\n' '```bash'
            printf '%s\n' "bal library search http client"
            printf '%s\n' "bal library get ballerina/http"
            printf '%s\n' '```'
          } > dist-staging/bal-library-tool-${V}/README.md

          (cd dist-staging && zip -qr "../release-assets/bal-library-tool-${V}.zip" "bal-library-tool-${V}")

          echo "Release assets:"
          ls -la release-assets/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          L="${{ steps.ls.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          {
            printf '%s\n' "## Install"
            printf '\n'
            printf '%s\n' "Download \`bal-library-tool-${V}.zip\` below, then:"
            printf '\n'
            printf '%s\n' "**macOS / Linux:**"
            printf '%s\n' '```bash'
            printf '%s\n' "unzip bal-library-tool-${V}.zip"
            printf '%s\n' "cd bal-library-tool-${V}"
            printf '%s\n' "./install.sh"
            printf '%s\n' '```'
            printf '\n'
            printf '%s\n' "**Windows (PowerShell):**"
            printf '%s\n' '```powershell'
            printf '%s\n' "Expand-Archive bal-library-tool-${V}.zip -DestinationPath ."
            printf '%s\n' "Set-Location bal-library-tool-${V}"
            printf '%s\n' ".\\install.ps1"
            printf '%s\n' '```'
            printf '\n'
            printf '%s\n' "Both installers are fully offline; they only need \`bal\` on your \`PATH\`."
            printf '\n'
            printf '%s\n' "---"
            printf '\n'
            printf '%s\n' "Built against \`ballerina-language-server@${L}\`."
          } > "$NOTES_FILE"
          gh release create "${GITHUB_REF_NAME}" \
            --title "v${V}" \
            --notes-file "$NOTES_FILE" \
            release-assets/*
